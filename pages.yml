# Pages CMS reads this file. Routine website edits happen in its forms.
media:
  input: images
  output: /images
  categories: [image]
  rename: false

content:
  - name: website
    label: Website content
    type: file
    path: content.json
    format: json
    fields:
      - name: profile
        label: About me
        type: object
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: degree, label: Degree after name, type: string }
          - { name: portrait, label: Portrait photograph, type: image }
          - { name: role, label: Current role, type: string }
          - { name: department, label: Department, type: string }
          - { name: departmentUrl, label: Department link, type: string }
          - { name: institution, label: Institution, type: string }
          - { name: institutionUrl, label: Institution link, type: string }
          - { name: bio, label: Biography paragraphs, type: text, list: true }
          - name: relatedLinks
            label: Biography links
            type: object
            list:
              collapsible: { collapsed: true, summary: "{label}" }
            fields:
              - { name: label, label: Link text, type: string }
              - { name: url, label: Link URL, type: string }

      - name: links
        label: CV and contact links
        type: object
        fields:
          - name: cvDriveUrl
            label: CV — Google Drive / Google Docs link
            type: string
            description: Paste the complete reader link to your CV. Leave empty until it is ready.
          - { name: scholar, label: Google Scholar URL, type: string }
          - { name: orcid, label: ORCID URL, type: string }
          - { name: github, label: GitHub URL, type: string }
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: researchgate, label: ResearchGate URL, type: string }
          - { name: twitter, label: X / Twitter URL, type: string }
          - { name: schedule, label: Meeting booking URL, type: string }
          - { name: email, label: Public contact email, type: string }

      - name: updates
        label: Updates — latest three active items appear first
        type: object
        list:
          collapsible: { collapsed: true, summary: "{dateLabel} · {title}" }
        fields:
          - name: date
            label: Sorting date
            type: string
            description: Use YYYY-MM-DD, YYYY-MM, or YYYY. Never invent an exact date.
            pattern:
              regex: '^\d{4}(-\d{2}(-\d{2})?)?$'
              message: Use YYYY, YYYY-MM, or YYYY-MM-DD.
          - { name: dateLabel, label: Date shown to visitors, type: string }
          - { name: title, label: Update title, type: string, required: true }
          - { name: kind, label: Activity type, type: string }
          - { name: detail, label: Short description, type: text }
          - { name: url, label: Event or supporting URL (optional), type: string }
          - name: active
            label: Show this update
            type: boolean
            description: Turn off to hide this item completely. Older active items move into See more.

      - name: researchCategories
        label: Research & Activities — descriptions and links
        type: object
        list:
          collapsible: { collapsed: true, summary: "{title}" }
        fields:
          - name: id
            label: Section anchor
            type: string
            description: A unique lowercase identifier, such as simulations or epigenetics.
            pattern: '^[a-z][a-z0-9-]*$'
          - { name: title, label: Area name, type: string, required: true }
          - { name: description, label: Area description, type: text }
          - name: documents
            label: Documents
            type: object
            list:
              collapsible: { collapsed: true, summary: "{title}" }
            fields:
              - { name: title, label: Document title, type: string, required: true }
              - { name: detail, label: One-line description, type: text }
              - name: url
                label: Google Drive / Google Docs link
                type: string
                description: Paste your Drive reader link. It takes priority over the public reference below.
              - name: fallbackUrl
                label: Public reference link
                type: string
                description: Optional article or institutional link used when the Drive link is empty.
              - { name: fallbackLabel, label: Public reference label, type: string }

      - name: timeline
        label: Academic journey — newest first
        type: object
        list:
          collapsible: { collapsed: true, summary: "{period} · {institution}" }
        fields:
          - { name: id, label: Unique identifier, type: string }
          - { name: period, label: Dates, type: string }
          - { name: title, label: Position or degree, type: string, required: true }
          - { name: institution, label: Institution, type: string }
          - { name: location, label: Location, type: string }
          - { name: detail, label: Short description, type: text }
          - { name: url, label: Optional institution or research link, type: string }

      - name: publications
        label: Publications
        type: object
        list:
          collapsible: { collapsed: true, summary: "{year} · {title}" }
        fields:
          - { name: title, label: Article title, type: string, required: true }
          - { name: authors, label: Authors, type: text }
          - { name: journal, label: Journal and citation, type: string }
          - { name: year, label: Publication year, type: number }
          - { name: url, label: DOI or article URL, type: string }
          - { name: selected, label: Selected publication, type: boolean }

      - name: additionalSections
        label: Additional sections (optional, hidden while empty)
        type: object
        list:
          collapsible: { collapsed: true, summary: "{title}" }
        fields:
          - { name: id, label: Section ID (lowercase), type: string }
          - { name: title, label: Section title, type: string, required: true }
          - { name: description, label: Brief introduction, type: text }
          - { name: visible, label: Display this section, type: boolean }
          - name: items
            label: Linked items (software, videos, resources)
            type: object
            list:
              collapsible: { collapsed: true, summary: "{title}" }
            fields:
              - { name: title, label: Item title, type: string, required: true }
              - { name: detail, label: Short description, type: text }
              - { name: url, label: URL (optional), type: string }

      - name: settings
        label: Analytics and display settings
        type: object
        fields:
          - name: ga4MeasurementId
            label: Google Analytics 4 measurement ID
            type: string
            description: Your existing connected GA4 destination is preserved. Use a G-XXXXXXXXXX ID; leave blank to disable analytics.
          - name: goatCounterCode
            label: GoatCounter site code (easy public total)
            type: string
            description: Optional. Sign up at goatcounter.com, then enter only your site code, not a URL. Public totals only; countries remain in the private dashboard.
          - name: visitorEndpoint
            label: Visitor counter service URL
            type: string
            description: Optional. Complete the visitor-counter setup before entering its HTTPS URL.
          - name: updatesVisible
            label: Visible updates (always 3)
            type: number
            readonly: true
